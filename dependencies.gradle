/*
 * Dependências do mod Forge 1.7.10. A convenção GTNH já traz Minecraft, Forge e o processador de anotações do
 * UniMixins/Mixin. O RyoikiTenkai não tem dependência obrigatória além de um provedor de Mixin (UniMixins).
 */
dependencies {
    // Só no ./gradlew runClient -Pangelica: o teste do teleporte com a renderização do modpack (TEOF usa Angelica).
    if (project.hasProperty("angelica")) {
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.2.45:dev")
    }
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
}
